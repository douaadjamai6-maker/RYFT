<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryft — Add New Listing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Photo upload slot previews & dropdowns */
    .photo-upload-section label {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .photo-upload-section label img.preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }
    .remove-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      z-index: 3;
    }
    select.listing-input {
      appearance: auto;
      background-color: #ffffff;
      cursor: pointer;
    }

    /* RYFTBOT Hero Banner Styling */
    .ryftbot-banner {
      background: linear-gradient(135deg, #114B5F, #00BCD4);
      color: #ffffff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
    }
    .ryftbot-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .ryftbot-icon-badge {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .ryftbot-text h3 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 2px 0;
    }
    .ryftbot-text p {
      font-size: 13px;
      margin: 0;
      opacity: 0.9;
    }
    .btn-use-ryftbot {
      background: #ffffff;
      color: #00BCD4;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: background 0.2s ease;
    }
    .btn-use-ryftbot:hover {
      background: #f1f5f9;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <a href="index.html"><img src="Logo.jpg" alt="Ryft logo" class="logo-img"></a>
    </div>
    
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="categories.html">Categories</a></li>
      <li><a href="add-listing.html" class="active">Sell</a></li>
    </ul>

    <div class="nav-icons">
      <a href="messages.html" class="icon-circle"><i class="fa-solid fa-comment"></i></a>
      <a href="saved-items.html" class="icon-circle"><i class="fa-solid fa-heart"></i></a>

      <div class="profile-dropdown-wrapper">
        <a href="buyer-profile.html" class="icon-circle"><i class="fa-solid fa-user"></i></a>
        
        <div class="profile-dropdown-menu">
          <a href="buyer-profile.html" class="dropdown-item">
            <i class="fa-regular fa-user"></i>
            <span>Your Profile</span>
          </a>
          <a href="seller-dashboard.html" class="dropdown-item">
            <i class="fa-solid fa-store"></i>
            <span>Switch to Seller Profile</span>
          </a>
          <div class="dropdown-divider"></div>
          <a href="signup-buyer.html" class="dropdown-item logout-item">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Log out</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="add-listing-container">
    <h1 class="page-title">Add New Listing</h1>

    <!-- RYFTBOT AI Banner Header -->
    <div class="ryftbot-banner">
      <div class="ryftbot-info">
        <div class="ryftbot-icon-badge">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div class="ryftbot-text">
          <h3>Hate typing details? Use RYFTBOT</h3>
          <p>Drop a screenshot of your Instagram post. The AI writes the title & description automatically!</p>
        </div>
      </div>
      <a href="ryftbot.html" class="btn-use-ryftbot">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Try RYFTBOT
      </a>
    </div>

    <form class="add-listing-form" id="listing-form">
      
      <div class="photo-upload-section">
        <label class="main-photo-upload">
          <input type="file" accept="image/*" hidden class="photo-file-input">
          <i class="fa-solid fa-plus upload-icon"></i>
          <span>Add main photo</span>
        </label>

        <div class="sub-photos-column">
          <label class="sub-photo-upload">
            <input type="file" accept="image/*" hidden class="photo-file-input">
            <i class="fa-solid fa-plus upload-icon-sm"></i>
          </label>
          <label class="sub-photo-upload">
            <input type="file" accept="image/*" hidden class="photo-file-input">
            <i class="fa-solid fa-plus upload-icon-sm"></i>
          </label>
        </div>
      </div>

      <div class="fields-section">
        
        <input type="text" id="title" placeholder="Product title" class="listing-input" required>

        <div class="form-row">
          <input type="number" id="price" placeholder="Price (DA)" class="listing-input" min="1" required>
          <select id="category" class="listing-input" required>
            <option value="" disabled selected>Category ▾</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Beauty">Beauty</option>
            <option value="Shoes">Shoes</option>
            <option value="Accessories">Accessories</option>
          </select>
        </div>

        <textarea id="description" placeholder="Description" class="listing-input listing-textarea" rows="4"></textarea>

        <div class="form-row">
          <select id="condition" class="listing-input">
            <option value="" disabled selected>Condition ▾</option>
            <option value="New">Brand New</option>
            <option value="Like New">Like New</option>
            <option value="Used - Good">Used - Good</option>
            <option value="Used - Fair">Used - Fair</option>
          </select>
          <input type="number" id="quantity" placeholder="Quantity" class="listing-input" min="1" value="1">
        </div>

        <div class="form-actions">
          <button type="button" class="btn-draft" id="btn-save-draft">Save as Draft</button>
          <button type="submit" class="btn-publish">Publish Listing</button>
        </div>

      </div>

    </form>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("listing-form");
      const fileInputs = document.querySelectorAll(".photo-file-input");
      const draftBtn = document.getElementById("btn-save-draft");

      // Auto-fill from RYFTBOT draft if directed here
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("autofill") === "true") {
        const botData = JSON.parse(localStorage.getItem("ryftbot_pending_draft") || "{}");
        if (botData.title) document.getElementById("title").value = botData.title;
        if (botData.price) document.getElementById("price").value = botData.price;
        if (botData.category) document.getElementById("category").value = botData.category;
        if (botData.description) document.getElementById("description").value = botData.description;
      }

      const uploadedImages = [];

      fileInputs.forEach((input, index) => {
        const label = input.parentElement;

        input.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (evt) => {
            const base64Image = evt.target.result;
            uploadedImages[index] = base64Image;

            const oldImg = label.querySelector(".preview-img");
            const oldBtn = label.querySelector(".remove-btn");
            if (oldImg) oldImg.remove();
            if (oldBtn) oldBtn.remove();

            const img = document.createElement("img");
            img.src = base64Image;
            img.className = "preview-img";

            const removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.className = "remove-btn";
            removeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';

            removeBtn.addEventListener("click", (ev) => {
              ev.stopPropagation();
              ev.preventDefault();
              input.value = "";
              uploadedImages[index] = null;
              img.remove();
              removeBtn.remove();
            });

            label.appendChild(img);
            label.appendChild(removeBtn);
          };

          reader.readAsDataURL(file);
        });
      });

      function getFormData() {
        return {
          id: Date.now(),
          title: document.getElementById("title").value.trim(),
          price: document.getElementById("price").value ? `${document.getElementById("price").value} DA` : "",
          category: document.getElementById("category").value,
          description: document.getElementById("description").value.trim(),
          condition: document.getElementById("condition").value,
          quantity: document.getElementById("quantity").value || 1,
          images: uploadedImages.filter(Boolean),
          reviewsCount: 0,
          messagesCount: 0
        };
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const newListing = getFormData();
        
        if (newListing.images.length === 0) {
          newListing.images.push("headphones.jpg"); 
        }

        const existingListings = JSON.parse(localStorage.getItem("ryft_seller_listings") || "[]");
        existingListings.unshift(newListing);
        localStorage.setItem("ryft_seller_listings", JSON.stringify(existingListings));

        alert("Listing published successfully!");
        window.location.href = "seller-dashboard.html";
      });

      draftBtn.addEventListener("click", () => {
        const draftData = getFormData();
        if (!draftData.title) {
          alert("Please enter at least a product title to save as draft.");
          return;
        }

        const existingDrafts = JSON.parse(localStorage.getItem("ryft_listing_drafts") || "[]");
        existingDrafts.unshift(draftData);
        localStorage.setItem("ryft_listing_drafts", JSON.stringify(existingDrafts));

        alert("Listing draft saved!");
        window.location.href = "seller-dashboard.html";
      });
    });

   
  </script>
</body>
</html>
