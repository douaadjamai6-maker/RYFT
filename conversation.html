<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="convo-page-title">RYFT — Conversation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Conversation Header linked to buyer profile -->
  <header class="convo-header">
    <a href="messages.html" class="back-arrow"><i class="fa-solid fa-arrow-left"></i></a>
    <a href="#" id="convo-profile-link" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;">
      <img id="convo-header-avatar" src="electrologo.jpg" alt="Shop logo" class="convo-avatar">
      <span id="convo-header-name" class="convo-name">Electro dz</span>
    </a>
  </header>

  <!-- Thread / Chat Area -->
  <main class="convo-thread">
    <!-- Messages & auto-sent product card load here dynamically -->
  </main>

  <!-- Message Input Bar -->
  <footer class="convo-input-bar">
    <input type="text" placeholder="Type a message">
    <button class="send-btn" aria-label="Send">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
    <button class="mic-btn" aria-label="Voice Message">
      <i class="fa-solid fa-microphone"></i>
    </button>
  </footer>

  <!-- Required External JS Link -->
  <script src="conversation.js"></script>
</body>
</html>
