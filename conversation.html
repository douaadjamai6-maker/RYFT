<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="convo-page-title">RYFT — Conversation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Conversation Header -->
  <header class="convo-header">
    <a href="messages.html" class="back-arrow"><i class="fa-solid fa-arrow-left"></i></a>
    <img id="convo-header-avatar" src="electrologo.jpg" alt="Shop logo" class="convo-avatar">
    <span id="convo-header-name" class="convo-name">Electro dz</span>
  </header>

  <!-- Thread / Chat Area -->
  <main class="convo-thread">

    <!-- Buyer Message (Right side) -->
    <div class="convo-row row-right">
      <div>
        <div class="bubble bubble-sent">
          Slm, esq mazalhom disponible?
        </div>
        <span class="bubble-time" style="text-align: right;">10:35 pm</span>
      </div>
      <div class="bubble-avatar">A</div>
    </div>

    <!-- Seller Response (Left side) -->
    <div class="convo-row row-left">
      <img id="convo-seller-avatar" src="electrologo.jpg" alt="Shop logo" class="bubble-avatar-img">
      <div>
        <div class="bubble bubble-received">
          Oui kho, l produit disponible
        </div>
        <span class="bubble-time">10:55 pm</span>
      </div>
    </div>

  </main>

  <!-- Message Input Bar -->
  <footer class="convo-input-bar">
    <input type="text" placeholder="Type a message">
    <button class="send-btn" aria-label="Send">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
    <button class="mic-btn" aria-label="Voice Message">
      <i class="fa-solid fa-microphone"></i>
    </button>
  </footer>

  <script src="conversation.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Get seller from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const sellerParam = urlParams.get("seller") || urlParams.get("shop");
      const rawSellerName = sellerParam ? decodeURIComponent(sellerParam) : "electro dz";
      const sellerKey = rawSellerName.toLowerCase().trim();

      // 2. Map store details
      const stores = {
        "electro dz": { name: "Electro dz", logo: "electrologo.jpg" },
        "thewoman_dz": { name: "thewoman_dz", logo: "clotheslogo.jpg" },
        "the_shoe_dz": { name: "the_shoe_dz", logo: "shoeslogo.jpg" },
        "makeup_dz": { name: "makeup_dz", logo: "makeuplogo.jpg" }
      };

      const currentStore = stores[sellerKey] || {
        name: rawSellerName,
        logo: "default-store.jpg"
      };

      // 3. Update DOM Elements
      const pageTitle = document.getElementById("convo-page-title");
      const headerName = document.getElementById("convo-header-name");
      const headerAvatar = document.getElementById("convo-header-avatar");
      const sellerAvatar = document.getElementById("convo-seller-avatar");

      if (pageTitle) pageTitle.textContent = `RYFT — ${currentStore.name}`;
      if (headerName) headerName.textContent = currentStore.name;
      if (headerAvatar) {
        headerAvatar.src = currentStore.logo;
        headerAvatar.alt = currentStore.name;
      }
      if (sellerAvatar) {
        sellerAvatar.src = currentStore.logo;
        sellerAvatar.alt = currentStore.name;
      }
    });
  </script>

</body>
</html>
