<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryft — RYFTBOT AI Assistant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Poppins', sans-serif;
    }

    .ryftbot-container {
      max-width: 680px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      height: 80vh;
      overflow: hidden;
    }

    .bot-header {
      background: #1e293b;
      color: #ffffff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bot-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #ffffff;
    }

    .chat-thread {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 85%;
    }

    .msg-bot {
      align-self: flex-start;
    }

    .msg-user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .msg-bot .msg-bubble {
      background: #f1f5f9;
      color: #0f172a;
      border-top-left-radius: 2px;
    }

    .msg-user .msg-bubble {
      background: #2563eb;
      color: #ffffff;
      border-top-right-radius: 2px;
    }

    /* Draft Card Preview inside Chat */
    .draft-preview-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .draft-preview-card h4 {
      margin: 0 0 6px 0;
      color: #0f172a;
      font-size: 15px;
    }

    .draft-tag {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .chat-input-area {
      padding: 14px 20px;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .upload-btn-label {
      background: #f1f5f9;
      color: #475569;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s;
    }

    .upload-btn-label:hover {
      background: #e2e8f0;
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .btn-send {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <a href="index.html"><img src="Logo.jpg" alt="Ryft logo" class="logo-img"></a>
    </div>
  </nav>

  <div class="ryftbot-container">
    <div class="bot-header">
      <div class="bot-profile">
        <div class="bot-avatar"><i class="fa-solid fa-robot"></i></div>
        <div>
          <h3 style="font-size: 15px; font-weight: 700; margin: 0;">RYFTBOT Listing Assistant</h3>
          <span style="font-size: 12px; opacity: 0.8;">Powered by Ryft AI</span>
        </div>
      </div>
      <a href="add-listing.html" style="color: #ffffff; text-decoration: none; font-size: 13px;"><i class="fa-solid fa-xmark"></i> Exit</a>
    </div>

    <div class="chat-thread" id="chat-thread">
      <div class="msg-row msg-bot">
        <div class="bot-avatar" style="width: 32px; height: 32px; font-size: 14px;"><i class="fa-solid fa-robot"></i></div>
        <div class="msg-bubble">
          <strong>Salam! 👋 I am RYFTBOT.</strong><br>
          Don't waste time typing listing details manually. Upload or send me a screenshot/photo of your Instagram post or product, and I'll extract the details for you!
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <label class="upload-btn-label" title="Upload screenshot">
        <i class="fa-solid fa-image"></i>
        <input type="file" id="image-upload" accept="image/*" hidden>
      </label>
      <input type="text" id="user-input" class="chat-input" placeholder="Type text or upload a screenshot...">
      <button class="btn-send" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const chatThread = document.getElementById("chat-thread");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const imageUpload = document.getElementById("image-upload");

      let botState = "WAITING_FOR_IMAGE"; // Step tracking
      let extractedProduct = {
        title: "Oversized Vintage Hoodie",
        category: "Clothing",
        description: "Premium heavy cotton oversized vintage hoodie. Available in sizes M/L/XL. Local Algerian delivery available.",
        price: ""
      };

      function appendMessage(text, isUser = false) {
        const msgRow = document.createElement("div");
        msgRow.className = `msg-row ${isUser ? 'msg-user' : 'msg-bot'}`;

        const avatarHTML = isUser ? "" : `<div class="bot-avatar" style="width: 32px; height: 32px; font-size: 14px;"><i class="fa-solid fa-robot"></i></div>`;
        
        msgRow.innerHTML = `
          ${avatarHTML}
          <div class="msg-bubble">${text}</div>
        `;

        chatThread.appendChild(msgRow);
        chatThread.scrollTop = chatThread.scrollHeight;
      }

      // Handle Image Upload Simulation
      imageUpload.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        appendMessage(`📷 Uploaded screenshot: <i>${file.name}</i>`, true);

        // AI Thinking delay
        setTimeout(() => {
          appendMessage("⚡ <i>Reading post caption and extracting item info...</i>");
          
          setTimeout(() => {
            botState = "WAITING_FOR_PRICE";
            appendMessage(`
              <strong>Got it! I extracted the listing details:</strong>
              <div class="draft-preview-card">
                <span class="draft-tag">${extractedProduct.category}</span>
                <h4>${extractedProduct.title}</h4>
                <p style="font-size:12px; color:#475569; margin:0;">${extractedProduct.description}</p>
              </div>
              <br><strong>Only one question left: What is the price in DA?</strong>
            `);
          }, 1200);
        }, 600);
      });

      // Handle Message Send
      sendBtn.addEventListener("click", () => {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, true);
        userInput.value = "";

        if (botState === "WAITING_FOR_PRICE") {
          extractedProduct.price = text.replace(/[^0-9]/g, ""); // Extract price numbers
          botState = "DONE";

          // Save draft to localStorage
          localStorage.setItem("ryftbot_pending_draft", JSON.stringify(extractedProduct));

          setTimeout(() => {
            appendMessage(`
              🎉 <strong>Awesome! Your listing draft is ready!</strong><br><br>
              <a href="add-listing.html?autofill=true" style="background:#2563eb; color:#fff; padding:8px 14px; border-radius:6px; text-decoration:none; font-weight:600; font-size:13px; display:inline-block;">
                Review & Edit Listing →
              </a>
            `);
          }, 800);
        } else {
          setTimeout(() => {
            appendMessage("Please click the photo icon on the left to upload an Instagram screenshot, or type the price if prompted!");
          }, 600);
        }
      });
    });
   
  </script>
</body>
</html>
