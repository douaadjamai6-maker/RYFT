<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryft — Edit Listing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Poppins', sans-serif;
    }
    .edit-page-wrapper {
      max-width: 780px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .back-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #2563eb;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      margin-bottom: 20px;
      transition: color 0.2s;
    }
    .back-nav-btn:hover {
      color: #1d4ed8;
    }
    .edit-card-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e7eb;
    }
    .edit-card-header {
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .edit-card-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1e293b;
    }
    .edit-card-header p {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
    }

    /* Form Fields */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-group-full {
      grid-column: span 2;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      background-color: #f8fafc;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    /* Product Photo Management Grid */
    .photo-upload-section {
      margin-bottom: 24px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    .photo-slot {
      aspect-ratio: 1;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    .photo-slot:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-slot i {
      font-size: 20px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .photo-slot span {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }
    .remove-photo-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(239, 68, 68, 0.9);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
    }

    /* Form Actions */
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1.5px solid #f1f5f9;
    }
    .btn-cancel {
      padding: 12px 24px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-cancel:hover {
      background: #f8fafc;
    }
 .btn-save {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: auto !important;          /* Overrides any fixed width holding the box back */
  min-width: max-content !important;/* Forces container background to fit full text */
  height: auto !important;         /* Prevents vertical clipping */
  padding: 12px 28px !important;
  white-space: nowrap !important;  /* Stops text from wrapping */
  gap: 8px;
  background: #1e293b;
  color: #ffffff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 4px 12px rgba(30, 41, 59, 0.2);
  transition: all 0.2s ease;
}
    
    .btn-save:hover {
      background: #0f172a;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <a href="index.html"><img src="Logo.jpg" alt="Ryft logo" class="logo-img"></a>
    </div>
  </nav>

  <div class="edit-page-wrapper">
    <a href="seller-dashboard.html" class="back-nav-btn"><i class="fa-solid fa-arrow-left"></i> Back to Seller Dashboard</a>
    
    <div class="edit-card-box">
      <div class="edit-card-header">
        <h1>Edit Product Listing</h1>
        <p>Update your product information, pricing, and images below.</p>
      </div>

      <form id="edit-product-form">
        
        <!-- Product Photo Upload Grid -->
        <div class="photo-upload-section">
          <label style="font-size: 13px; font-weight: 600; color: #334155;">Product Images</label>
          <div class="photo-grid">
            <div class="photo-slot" id="primary-photo-slot">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <span>Main Photo</span>
              <input type="file" id="img-input-1" accept="image/*" style="display: none;">
            </div>
            <div class="photo-slot" class="add-extra-photo">
              <i class="fa-solid fa-plus"></i>
              <span>Add Photo</span>
              <input type="file" class="img-input-extra" accept="image/*" style="display: none;">
            </div>
            <div class="photo-slot" class="add-extra-photo">
              <i class="fa-solid fa-plus"></i>
              <span>Add Photo</span>
              <input type="file" class="img-input-extra" accept="image/*" style="display: none;">
            </div>
            <div class="photo-slot" class="add-extra-photo">
              <i class="fa-solid fa-plus"></i>
              <span>Add Photo</span>
              <input type="file" class="img-input-extra" accept="image/*" style="display: none;">
            </div>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group form-group-full">
            <label>Product Title</label>
            <input type="text" id="edit-title-input" class="form-control" placeholder="e.g. Wireless Noise-Cancelling Headphones" required>
          </div>

          <div class="form-group">
            <label>Price (DA)</label>
            <input type="text" id="edit-price-input" class="form-control" placeholder="3500 DA" required>
          </div>

          <div class="form-group">
            <label>Category</label>
            <select id="edit-category-select" class="form-control">
              <option value="Electronics">Electronics</option>
              <option value="Clothing">Clothing</option>
              <option value="Beauty">Beauty</option>
              <option value="Shoes">Shoes</option>
              <option value="Accessories">Accessories</option>
            </select>
          </div>

          <div class="form-group form-group-full">
            <label>Detailed Description</label>
            <textarea id="edit-desc-input" class="form-control" rows="4" placeholder="Describe the item condition, specs, and features...">Original imported gear in mint condition. Includes charger and original box.</textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="window.location.href='seller-dashboard.html'">Cancel</button>
          <button type="submit" class="btn-save"><i class="fa-solid fa-check"></i> Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const title = urlParams.get("title") || "";
      const price = urlParams.get("price") || "";

      const titleInput = document.getElementById("edit-title-input");
      const priceInput = document.getElementById("edit-price-input");

      if (titleInput) titleInput.value = title;
      if (priceInput) priceInput.value = price;

      // Photo Slot Click Handlers
      const slots = document.querySelectorAll(".photo-slot");
      slots.forEach(slot => {
        const fileInput = slot.querySelector("input[type='file']");
        slot.addEventListener("click", (e) => {
          if (e.target.classList.contains("remove-photo-btn")) return;
          fileInput.click();
        });

        fileInput.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (evt) => {
              slot.innerHTML = `
                <img src="${evt.target.result}" alt="Product Photo">
                <button type="button" class="remove-photo-btn"><i class="fa-solid fa-xmark"></i></button>
              `;
              slot.querySelector(".remove-photo-btn").addEventListener("click", (ev) => {
                ev.stopPropagation();
                slot.innerHTML = `
                  <i class="fa-solid fa-plus"></i>
                  <span>Add Photo</span>
                  <input type="file" accept="image/*" style="display: none;">
                `;
              });
            };
            reader.readAsDataURL(file);
          }
        });
      });

      document.getElementById("edit-product-form").addEventListener("submit", (e) => {
        e.preventDefault();
        alert("Listing details updated successfully!");
        window.location.href = "seller-dashboard.html";
      });
    });
  </script>
</body>
</html>
