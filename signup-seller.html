<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryft — Seller Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    .input-with-action {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .input-action-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #2563eb;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #6b7280;
      cursor: pointer;
    }
    
    /* Styled File Upload Container */
    .file-upload-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .file-upload-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #f3f4f6;
      border: 1px dashed #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      color: #374151;
      cursor: pointer;
      width: 100%;
      justify-content: center;
    }
    .file-upload-label:hover {
      background: #e5e7eb;
    }
    .logo-preview-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }
  </style>
</head>
<body class="auth-body">

  <header class="auth-header">
    <a href="index.html" class="logo">
      <img src="Logo.jpg" alt="Ryft logo" class="logo-img">
    </a>
  </header>

  <main class="auth-container" style="max-width: 600px;">
    <p class="auth-label">I want to:</p>

    <div class="role-toggle">
      <a href="signup-buyer.html" class="role-btn">Buy Product</a>
      <a href="signup-seller.html" class="role-btn active">Sell Product</a>
    </div>

    <form class="auth-form" id="seller-signup-form" novalidate>
      
      <div class="form-row">
        <input type="text" id="seller-fullname" placeholder="Owner full name *" class="auth-input" required>
        <div class="input-with-action">
          <input type="password" id="seller-password" placeholder="Password *" class="auth-input" style="width:100%;" required minlength="6">
          <button type="button" id="toggle-password-btn" class="password-toggle-btn"><i class="fa-regular fa-eye"></i></button>
        </div>
      </div>

      <div class="form-row">
        <input type="tel" id="seller-phone" placeholder="Phone number *" class="auth-input" required>
        <div class="input-with-action">
          <input type="text" id="seller-otp" placeholder="OTP code *" class="auth-input" style="width:100%;" required>
          <button type="button" id="send-otp-btn" class="input-action-btn">Send OTP</button>
        </div>
      </div>

      <span class="section-title-auth">Shop details</span>

      <input type="text" id="shop-name" placeholder="Shop name *" class="auth-input" required>

      <div class="form-row">
        <select id="shop-category" class="auth-input" required>
          <option value="" disabled selected>Select Category *</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Beauty">Beauty</option>
          <option value="Shoes">Shoes</option>
        </select>

        <select id="shop-wilaya" class="auth-input" required>
          <option value="" disabled selected>Select Wilaya *</option>
          <!-- Populated dynamically via JS -->
        </select>
      </div>

      <input type="text" id="shop-desc" placeholder="Short shop description" class="auth-input">

      <div class="form-row" style="align-items: center;">
        <div class="file-upload-wrapper">
          <label for="shop-logo-input" class="file-upload-label">
            <i class="fa-solid fa-upload"></i> <span id="logo-file-name">Upload Shop Logo</span>
          </label>
          <input type="file" id="shop-logo-input" accept="image/*" style="display: none;">
          <img id="logo-preview" class="logo-preview-img" alt="Logo preview">
        </div>

        <input type="url" id="shop-social" placeholder="Instagram/FB link" class="auth-input">
      </div>

      <button type="submit" id="seller-submit-btn" class="auth-submit-btn">Create Seller Account</button>
    </form>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const wilayas = [
        "01 - Adrar", "02 - Chlef", "03 - Laghouat", "04 - Oum El Bouaghi", "05 - Batna", 
        "06 - Béjaïa", "07 - Biskra", "08 - Béchar", "09 - Blida", "10 - Bouira", 
        "11 - Tamanrasset", "12 - Tébessa", "13 - Tlemcen", "14 - Tiaret", "15 - Tizi Ouzou", 
        "16 - Algiers", "17 - Djelfa", "18 - Jijel", "19 - Sétif", "20 - Saïda", 
        "21 - Skikda", "22 - Sidi Bel Abbès", "23 - Annaba", "24 - Guelma", "25 - Constantine", 
        "26 - Médéa", "27 - Mostaganem", "28 - M'Sila", "29 - Mascara", "30 - Ouargla", 
        "31 - Oran", "32 - El Bayadh", "33 - Illizi", "34 - Bordj Bou Arréridj", "35 - Boumerdès", 
        "36 - El Tarf", "37 - Tindouf", "38 - Tissemsilt", "39 - El Oued", "40 - Khenchela", 
        "41 - Souk Ahras", "42 - Tipaza", "43 - Mila", "44 - Aïn Defla", "45 - Naâma", 
        "46 - Aïn Témouchent", "47 - Ghardaïa", "48 - Relizane", "49 - El M'Ghair", "50 - El Meniaa", 
        "51 - Ouled Djellal", "52 - Bordj Baji Mokhtar", "53 - Béni Abbès", "54 - Timimoun", "55 - Touggourt", 
        "56 - Djanet", "57 - In Salah", "58 - In Guezzam"
      ];

      // Populate Wilaya Select Menu
      const wilayaSelect = document.getElementById("shop-wilaya");
      if (wilayaSelect) {
        wilayas.forEach(w => {
          const opt = document.createElement("option");
          opt.value = w.includes("-") ? w.split("-")[1].trim() : w;
          opt.textContent = w;
          wilayaSelect.appendChild(opt);
        });
      }

      // Password Toggle
      const passwordInput = document.getElementById("seller-password");
      const togglePasswordBtn = document.getElementById("toggle-password-btn");
      if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener("click", () => {
          const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
          passwordInput.setAttribute("type", type);
          togglePasswordBtn.innerHTML = type === "password" ? '<i class="fa-regular fa-eye"></i>' : '<i class="fa-regular fa-eye-slash"></i>';
        });
      }

      // Send OTP button
      const sendOtpBtn = document.getElementById("send-otp-btn");
      const phoneInput = document.getElementById("seller-phone");
      if (sendOtpBtn) {
        sendOtpBtn.addEventListener("click", () => {
          if (!phoneInput.value.trim()) {
            alert("Please enter your phone number first.");
            phoneInput.focus();
            return;
          }
          sendOtpBtn.disabled = true;
          sendOtpBtn.textContent = "Sent!";
          alert(`Demo OTP sent to ${phoneInput.value.trim()}. (Use 1234 to test)`);
        });
      }

      // File Logo Preview
      const logoInput = document.getElementById("shop-logo-input");
      const logoFileName = document.getElementById("logo-file-name");
      const logoPreview = document.getElementById("logo-preview");

      if (logoInput) {
        logoInput.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (file) {
            logoFileName.textContent = file.name;
            const reader = new FileReader();
            reader.onload = (event) => {
              logoPreview.src = event.target.result;
              logoPreview.style.display = "block";
            };
            reader.readAsDataURL(file);
          }
        });
      }

      // Form Validation & Redirect to Seller Dashboard
      const form = document.getElementById("seller-signup-form");
      const submitBtn = document.getElementById("seller-submit-btn");

      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();

          const ownerName = document.getElementById("seller-fullname").value.trim();
          const shopName = document.getElementById("shop-name").value.trim();
          const category = document.getElementById("shop-category").value;
          const wilaya = document.getElementById("shop-wilaya").value;

          if (!ownerName || !shopName || !category || !wilaya) {
            alert("Please complete all required fields marked with *.");
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "Setting up your store...";

          // Save active seller session
          const sellerSession = {
            role: "seller",
            ownerName: ownerName,
            shopName: shopName,
            category: category,
            wilaya: wilaya,
            isLoggedIn: true
          };
          localStorage.setItem("ryft_user", JSON.stringify(sellerSession));

          setTimeout(() => {
            window.location.href = "seller-dashboard.html";
          }, 800);
        });
      }
    });
   
  </script>
</body>
</html>
